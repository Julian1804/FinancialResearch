<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FR Research Platform v3</title><link rel="icon" href="data:,">
<style>:root{--bg:#0c1117;--pn:#151e29;--ln:#273241;--ink:#edf2f7;--mt:#79899c;--ac:#6ea8fe;--gr:#6fcf97;--am:#f2c76b;--rd:#ff8a7a}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:16px;line-height:1.35}
aside{width:190px;background:var(--pn);border-right:1px solid var(--ln);padding:16px 10px;flex-shrink:0;overflow-y:auto}
aside h2{font-size:16px;margin-bottom:14px;color:var(--ac);font-weight:600}
aside nav a{display:block;color:var(--mt);text-decoration:none;padding:9px 11px;border-radius:5px;font-size:15px;margin:3px 0;cursor:pointer}
aside nav a:hover,aside nav a.sel{color:var(--ink);background:#1e2a3a}
aside .sep{height:1px;background:var(--ln);margin:8px 0}
main{flex:1;padding:24px 28px;overflow-y:auto;max-width:none;width:calc(100vw - 190px);min-width:0}
h1{font-size:30px;margin-bottom:8px;font-weight:700}
h2{font-size:22px;margin:22px 0 10px;border-bottom:1px solid var(--ln);padding-bottom:8px;font-weight:600}
h3{font-size:16px;margin-bottom:8px;color:var(--mt)}
.card{background:var(--pn);border:1px solid #334155;border-radius:8px;padding:16px 18px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.kpi{text-align:left;cursor:pointer;min-height:142px}.kpi .val{font-size:31px;font-weight:700;margin:4px 0}.kpi .lab{font-size:16px;color:var(--mt)}.kpi .chg{font-size:14px;font-weight:600}.kpi .date{font-size:12px;color:#7a8796}.kpi .src{font-size:12px;color:#7a8796}
.tag{padding:3px 8px;border-radius:4px;font-size:12px;display:inline-block;margin:1px}.g{background:#064e3b;color:#6ee7b7}.y{background:#78350f;color:#fcd34d}.r{background:#7f1d1d;color:#fca5a5}.gray{background:#333;color:#aaa}
canvas{width:100%;height:420px;background:var(--pn);border-radius:6px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.c{background:var(--pn);border:1px solid #334155;border-radius:8px;padding:16px}
.c h4{font-size:16px;color:var(--mt);margin-bottom:8px}.c .info{font-size:13px;color:#7a8796}
.ctls{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.ctls button{background:#252540;color:#b7c2d0;border:1px solid #3a3a50;padding:6px 10px;border-radius:4px;font-size:12px;cursor:pointer}.ctls button:hover{background:#3a3a60}
.btn{background:#2a2a40;color:#c8d1dc;border:1px solid #3a3a50;padding:8px 14px;border-radius:4px;font-size:13px;cursor:pointer}.btn:hover{background:#3a3a60}.btn.pri{background:#2563eb;color:#fff}.btn.sm{padding:5px 9px;font-size:12px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}.dg{background:var(--gr)}.dgrey{background:#555}
.stbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.si{background:var(--pn);border:1px solid #334155;border-radius:5px;padding:7px 12px;cursor:pointer;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln)}th{color:var(--mt);font-weight:600;font-size:14px}td{color:var(--ink)}
input,select,textarea{background:var(--pn);border:1px solid #334155;color:var(--ink);padding:9px 10px;border-radius:4px;font-size:14px;max-width:360px}
.note{font-size:10px;color:#555;margin-top:14px;border-top:1px solid var(--ln);padding-top:8px;display:flex;justify-content:space-between;align-items:center}
.csl{padding:3px 6px;border-radius:3px;font-size:10px;color:#6ee7b7;background:#064e3b}
.modulebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;padding:10px 12px;border:1px solid #334155;background:#101824;border-radius:8px}
.switch{display:inline-flex;align-items:center;gap:8px;color:#aab7c4;font-size:13px}.switch input{width:auto;max-width:none}
.disabled-panel{max-width:760px;margin-top:24px}.disabled-panel p{color:#aab7c4;margin:8px 0 14px}
.chart-link{margin-top:10px}.modal{position:fixed;inset:0;background:rgba(3,7,12,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}.modalbox{width:min(1280px,96vw);max-height:92vh;overflow:auto;background:#101824;border:1px solid #3a4656;border-radius:8px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.modalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}.modalhead h2{border:0;margin:0;padding:0}.tip{position:absolute;display:none;pointer-events:none;background:#07101b;border:1px solid #5b6776;color:#edf2f7;padding:8px 10px;border-radius:5px;font-size:12px;z-index:30;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.refreshing{position:relative}.refreshing:after{content:'Refreshing...';position:absolute;right:12px;top:12px;background:#78350f;color:#fcd34d;border:1px solid #a16207;border-radius:4px;padding:4px 8px;font-size:12px}
.workspace-shell{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;gap:14px;align-items:start}.workspace-nav,.ai-bridge{position:sticky;top:0}.ai-bridge{width:auto;border-right:1px solid #334155;overflow:auto}.workspace-nav button{width:100%;text-align:left;margin:4px 0}.workspace-nav button.sel{background:#2563eb;color:#fff}.module-summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.module-summary-card{min-height:148px}.module-summary-card .val{font-size:24px;font-weight:700;margin:6px 0}.module-summary-card .src{font-size:11px}.series-table td,.series-table th{font-size:12px}.ai-preview{white-space:pre-wrap;max-height:620px;overflow:auto;background:#0b131d;border:1px solid #334155;border-radius:5px;padding:10px;font-size:11px}.bridge-status{min-height:18px;color:#6ee7b7;margin:4px 0}.workspace-gap{margin:5px 0;color:#fcd34d}@media(max-width:1180px){.workspace-shell{grid-template-columns:200px minmax(0,1fr)}.ai-bridge{grid-column:1/-1;position:static}}@media(max-width:760px){.workspace-shell{grid-template-columns:1fr}.workspace-nav{position:static}}
</style></head>
<body>
<aside><h2>FR Platform v3</h2><nav id="nav"></nav></aside>
<main id="main"><div style="padding:40px;text-align:center"><h1 style="color:var(--ac)">FR Research Platform v3</h1><div id="lmsg" style="margin:16px;color:var(--mt);font-size:13px">Loading dashboard data...</div><button id="lretry" class="btn" onclick="location.reload()" style="display:none;margin-top:12px">Retry</button><button id="ldebug" class="btn" onclick="window.open('/api/debug/build_info','_blank')" style="display:none;margin-top:12px;margin-left:6px;font-size:10px">Debug</button></div></main>
<script>
var NAVS=[['Home','home'],['Module Workspace','modules'],['Macro','macro'],['Rates','rates'],['FX','fx'],['Indices','indices'],['Futures','futures'],['Commodities','commodities'],['ETF','etf'],['Research Projects','projects'],['Company','company'],['Operations','ops']];
var KPI_DEF=['DXY','USD_CNY','US10Y','US2Y','CN10Y','LPR','PMI_MFG','sh000001','sh000300','N225','HSI','.DJI','IF0','AU0','EUR_USD'];
var PICKS={rates:['US10Y','US2Y','US5Y','US30Y','FedFunds','SOFR','LPR','CN10Y','CN5Y','CN1Y','FDR007','DR007','SHIBOR_3M','JP10Y','JP2Y','DE10Y','UK10Y','ECB_RATE'],fx:['DXY','USD_CNY','EUR_USD','USD_JPY','GBP_USD'],indices:['sh000001','sh000300','sz399001','sz399006','sh000016','sh000905','sh000688','.INX','.IXIC','.DJI','N225','TOPIX','HSI','HSCEI','TWII','KOSPI','ASX200','FTSE','GDAXI','FCHI','SX5E','RUT','MSCI_World','MSCI_EM'],futures:['IF0','IC0','IH0','IM0'],commodities:['AU0','SC0','CU0','AL0','RB0','M0','EG0']};
var BOOT={},kpi=[],API='/api/data_console';
var CLR={gr:'#6fcf97',rd:'#ff8a7a',am:'#f2c76b',ac:'#6ea8fe'};

function N(){
  var n=document.getElementById('nav'),h='';
  NAVS.forEach(function(p){h+='<a id=\"n_'+p[1]+'\" onclick=\"G(\''+p[1]+'\')\">'+p[0]+'</a>'});
  h+='<div class=\"sep\"></div><a href=\"/index_legacy.html\" style=\"font-size:10px;color:#555\">Legacy</a>';
  n.innerHTML=h;
}
function G(s){
  document.querySelectorAll('#nav a').forEach(function(a){a.classList.remove('sel')});
  var na=document.getElementById('n_'+s);if(na)na.classList.add('sel');
  if(s==='home')H();else if(s==='macro')MCR();else if(s==='company')CO();else if(s==='ops')OP();else X(s);window.scrollTo(0,0);
}

// ===== BOOTSTRAP =====
async function L(){
  var lm=document.getElementById('lmsg'),lr=document.getElementById('lretry'),ld=document.getElementById('ldebug');
  // Timeout fallback: render home with whatever we have after 3s
  var done=false;
  setTimeout(function(){if(!done){done=true;N();H();lm.style.color='var(--am)';lm.innerHTML='Bootstrap slow - showing cached/partial data. <a href=\"#\" onclick=\"location.reload()\" style=\"color:var(--ac)\">Retry</a>';lr.style.display='inline';ld.style.display='inline'}},3000);
  try{
    var r=await fetch(API+'/bootstrap');
    if(!r.ok)throw new Error('HTTP '+r.status);
    BOOT=await r.json();
  }catch(e){
    BOOT={kpi:{},sources_summary:{},error:''+e};
  }
  BCT=BOOT;
  kpi=JSON.parse(localStorage.getItem('v3kpi')||'[]');if(!kpi.length)kpi=KPI_DEF.slice();
  N();
  if(BOOT.error && !done){done=true;ERR('Bootstrap failed: '+BOOT.error);return}
  if(!done){done=true;G('home')}
  else if(document.getElementById('kp')){H()} // re-render if timeout already did
}

function ESC(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ERR(msg){N();document.getElementById('main').innerHTML='<h1>FR Research Platform v3</h1><div class=\"card\" id=\"errpanel\"><h2>Dashboard data error</h2><p>'+ESC(msg)+'</p><button class=\"btn pri\" onclick=\"location.reload()\">Retry</button><a class=\"btn\" href=\"/api/debug/build_info\" target=\"_blank\" style=\"margin-left:6px;text-decoration:none\">Debug</a></div>'}
function NAR(sym){var s=(BCT.coverage_status||{})[sym]||{};return s.no_data_reason||s.status||'source_gap'}

// ===== CHART with axes =====
function CTX(cv,vals,dates,unit){
  var ctx=cv.getContext('2d'),W=cv.width,H=cv.height,mt=24,mb=30,ml=52,mr=14;
  ctx.clearRect(0,0,W,H);
  if(!vals.length){ctx.fillStyle='#555';ctx.font='14px system-ui';ctx.fillText('No data',ml,80);return}
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn||1;
  var gw=W-ml-mr,gh=H-mt-mb,sx=gw/(vals.length-1),sy=gh/rg;
  // grid lines + y labels (5 ticks)
  ctx.strokeStyle='#1e2a3a';ctx.lineWidth=0.5;ctx.font='11px monospace';ctx.fillStyle='#778';
  for(var i=0;i<=4;i++){var yv=mn+rg*(4-i)/4,yp=mt+(i/4)*gh;ctx.beginPath();ctx.moveTo(ml,Math.round(yp));ctx.lineTo(W-mr,Math.round(yp));ctx.stroke();ctx.fillText(yv.toFixed(2)+(unit||''),2,yp+4)}
  // x date labels
  ctx.fillStyle='#778';ctx.font='10px monospace';
  var xstep=Math.max(1,Math.floor(vals.length/8));
  for(var i=0;i<vals.length;i+=xstep){var xp=ml+i*sx;ctx.fillText((dates[i]||'').slice(5),xp-16,H-4)}
  // line
  ctx.strokeStyle='#6ea8fe';ctx.lineWidth=2;ctx.beginPath();
  for(var i=0;i<vals.length;i++){var x=ml+i*sx,y=H-mb-(vals[i]-mn)*sy;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
}

async function CHART(sym,lbk,cvid,infoid){
  var cv=document.getElementById(cvid),info=document.getElementById(infoid);
  if(!cv)return;
  try{
    var r=await fetch(API+'/timeseries?instrument='+encodeURIComponent(sym)+'&lookback='+lbk);
    var d=await r.json(),data=d.data||[],N=data.length;
    if(!N){if(info)info.innerHTML='<span class=\"tag r\">N/A</span>';return}
    var vals=[],dates=[],unit='';
    for(var i=0;i<N;i++){
      var v=data[i].close||data[i].value||data[i].settlement||0;
      vals.push(v);dates.push(data[i].trade_date||data[i].observation_date||'');
      if(!unit&&data[i].unit)unit=data[i].unit;
    }
    var l=vals[N-1],f=vals[0],chg=f?((l-f)/f*100).toFixed(2):'?',cl=parseFloat(chg)>=0?CLR.gr:CLR.rd;
    var src=data[0].source||'?';
    if(info)info.innerHTML=N+' pts | <b>'+l.toFixed(2)+'</b> <span style=\"color:'+cl+'">'+chg+'%</span> | <span class=\"csl\">'+src+'</span>';
    CTX(cv,vals,dates,unit);
  }catch(e){if(info)info.innerHTML='<span class=\"tag r\">Err</span>'}
}

// ===== HOME =====
async function H(){
  var m=document.getElementById('main');
  m.innerHTML='<h1>FR Research Platform v3</h1><div class=\"stbar\" id=\"sb\"></div><h2>Key Indicators</h2><div class=\"row\" id=\"kp\">Loading...</div><h2>Quick Charts</h2><div class=\"charts\" id=\"qc\"></div>';
  // source bar
  var sb=document.getElementById('sb'),sh='';
  Object.entries(BOOT.sources_summary||{}).slice(0,9).forEach(function(e){
    var n=e[0],v=e[1];sh+='<div class=\"si\" onclick=\"G(\''+(n.indexOf('rate')>=0?'rates':n.indexOf('fx')>=0?'fx':n.indexOf('fut')>=0?'futures':n.indexOf('com')>=0?'commodities':n.indexOf('ind')>=0?'indices':'home')+'\')\"><span class=\"dot '+(v.records>0?'dg':'dgrey')+'\"></span>'+n.replace(/_/g,' ')+' <b>'+(v.records>999?(v.records/1000).toFixed(0)+'K':v.records)+'</b></div>'
  });
  if(!sh)sh='<div class=\"si\"><span class=\"dot dgrey\"></span>source summary <b>no_data</b></div>';
  sb.innerHTML=sh;
  // KPI cards from bootstrap (instant)
  var kp=document.getElementById('kp'),row='';
  var bk=BCT.kpi||{};
  kpi.forEach(function(sym){
    var v=bk[sym];
    var valCell=v?('<div class=\"val\">'+parseFloat(v.value).toFixed(2)+'</div><div class=\"chg\" style=\"color:'+(v.change_pct>=0?CLR.gr:CLR.rd)+'\">'+v.change_pct+'%</div><div class=\"date\">'+v.date+'</div><div class=\"src\">'+v.source+' | '+v.asof+'</div>'):'<div class=\"val\">--</div><div class=\"date\"><span class=\"tag r\">NA</span></div>';
    row+='<div class=\"card kpi\" onclick=\"G(\''+FS(sym)+'\')\"><div class=\"lab\">'+sym+'</div>'+valCell+'</div>';
  });
  kp.innerHTML=row;
  // Quick charts (lazy)
  RQC();
}
var BCT={};
function FS(sym){for(var k in PICKS)if(PICKS[k].indexOf(sym)>=0)return k;return'home'}
function RQC(){
  var ct=document.getElementById('qc');if(!ct)return;ct.innerHTML='';
  var bk=BCT.kpi||{},cnt=0;
  for(var i=0;i<kpi.length&&cnt<5;i++){var sym=kpi[i];if(!bk[sym])continue;
    var cid='qc_'+cnt,iid='qci_'+cnt;cnt++;
    var box=document.createElement('div');box.className='c';
    box.innerHTML='<h4>'+sym+' <span style=\"font-size:9px;color:#444;margin-left:4px\">'+bk[sym].value.toFixed(2)+' | '+bk[sym].date+'</span></h4><canvas id=\"'+cid+'\" width=\"340\" height=\"180\"></canvas><div class=\"info\" id=\"'+iid+'\"></div>';
    ct.appendChild(box);CHART(sym,30,cid,iid);
  }
}

// ===== SECTOR PAGES =====
function X(sec){
  var picks=PICKS[sec]||[],title=sec.charAt(0).toUpperCase()+sec.slice(1),m=document.getElementById('main');
  if(sec==='indices'){X_IDX();return}
  m.innerHTML='<h1>'+title+'</h1><div class="stbar" id="sb2"></div><div class="row" id="sk"></div><h2>Charts</h2><div class="charts" id="sc"></div>';
  // Source bar
  var bk=BCT.sources_summary||{},co=0;document.getElementById('sb2').innerHTML='';
  Object.entries(bk).forEach(function(e){if(e[0].indexOf(sec.slice(0,3))>=0||(sec==='rates'&&e[0].indexOf('rate')>=0)||(sec==='fx'&&e[0]==='fx')){document.getElementById('sb2').innerHTML+='<div class="si">'+e[0]+' <b>'+e[1].records+'</b></div>';co++}});
  if(!co)document.getElementById('sb2').innerHTML='<div class="si">No source data</div>';
  // KPI cards from bootstrap
  var skp=document.getElementById('sk'),sct=document.getElementById('sc');
  picks.forEach(function(sym){
    var v=(BCT.kpi||{})[sym],valCell='<div class="val" style="font-size:16px">...</div>';
    if(v)valCell='<div class="val" style="font-size:16px">'+v.value.toFixed(2)+'</div><div class="chg" style="color:'+(v.change_pct>=0?CLR.gr:CLR.rd)+'">'+v.change_pct+'%</div><div class="date">'+v.date+'</div><div class="src">'+v.source+'</div>';
    else valCell='<div class="val" style="font-size:16px">--</div><div class="date"><span class="tag gray">'+ESC(NAR(sym))+'</span></div>';
    skp.innerHTML+='<div class="card kpi"><div class="lab">'+sym+'</div>'+valCell+'</div>';
    var box=document.createElement('div');box.className='c';
    box.innerHTML='<h4>'+sym+'</h4><canvas id="sc_'+sym+'" width="420" height="260"></canvas><div class="info" id="sci_'+sym+'"></div><div class="ctls"><button class="btn sm" onclick="CHART(\''+sym+'\',7,\'sc_'+sym+'\',\'sci_'+sym+'\')">7D</button><button class="btn sm" onclick="CHART(\''+sym+'\',30,\'sc_'+sym+'\',\'sci_'+sym+'\')">1M</button><button class="btn sm" onclick="CHART(\''+sym+'\',90,\'sc_'+sym+'\',\'sci_'+sym+'\')">3M</button><button class="btn sm" onclick="CHART(\''+sym+'\',180,\'sc_'+sym+'\',\'sci_'+sym+'\')">6M</button><button class="btn sm" onclick="CHART(\''+sym+'\',365,\'sc_'+sym+'\',\'sci_'+sym+'\')">1Y</button></div>';
    sct.appendChild(box);CHART(sym,90,'sc_'+sym,'sci_'+sym);
  });
}

// ===== INDICES REGION GROUPING =====
function X_IDX(){
  var m=document.getElementById('main');
  m.innerHTML='<h1>Indices</h1><div class="stbar" id="sb2"></div><div id="idx_body"></div>';
  var groups={
    'China':['sh000001','sh000300','sz399001','sz399006','sh000016','sh000905','sh000688'],
    'Asia Pacific':['N225','TOPIX','HSI','HSCEI','TWII','KOSPI','ASX200'],
    'Americas':['.INX','.IXIC','.DJI','RUT'],
    'Europe / Africa / Middle East':['FTSE','GDAXI','FCHI','SX5E'],
    'Other / Global / EM':['MSCI_World','MSCI_EM']
  };
  var bk=BCT.kpi||{},co=0;
  document.getElementById('sb2').innerHTML='';
  Object.entries(BCT.sources_summary||{}).forEach(function(e){if(e[0].indexOf('ind')>=0){document.getElementById('sb2').innerHTML+='<div class="si">'+e[0]+' <b>'+e[1].records+'</b></div>';co++}});
  if(!co)document.getElementById('sb2').innerHTML='<div class="si">No source data</div>';
  var h='';
  Object.entries(groups).forEach(function(pair){
    var gname=pair[0],syms=pair[1];
    h+='<h2>'+gname+'</h2><div class="row">';
    syms.forEach(function(sym){
      var v=bk[sym];
      var hasData=!!v;
      h+='<div class="card kpi"><div class="lab">'+sym+'</div>';
      if(hasData){
        h+='<div class="val" style="font-size:16px">'+v.value.toFixed(2)+'</div><div class="chg" style="color:'+(v.change_pct>=0?CLR.gr:CLR.rd)+'">'+v.change_pct+'%</div><div class="date">'+v.date+'</div><div class="src">'+v.source+'</div>';
      }else{
        h+='<div class="val" style="font-size:16px">--</div><div class="date"><span class="tag gray">'+ESC(NAR(sym))+'</span></div>';
      }
      h+='</div>';
    });
    h+='</div><div class="charts">';
    syms.forEach(function(sym){
      h+='<div class="c"><h4>'+sym+'</h4><canvas id="sc_'+sym+'" width="420" height="260"></canvas><div class="info" id="sci_'+sym+'"></div><div class="ctls"><button class="btn sm" onclick="CHART(\''+sym+'\',7,\'sc_'+sym+'\',\'sci_'+sym+'\')">7D</button><button class="btn sm" onclick="CHART(\''+sym+'\',30,\'sc_'+sym+'\',\'sci_'+sym+'\')">1M</button><button class="btn sm" onclick="CHART(\''+sym+'\',90,\'sc_'+sym+'\',\'sci_'+sym+'\')">3M</button><button class="btn sm" onclick="CHART(\''+sym+'\',180,\'sc_'+sym+'\',\'sci_'+sym+'\')">6M</button><button class="btn sm" onclick="CHART(\''+sym+'\',365,\'sc_'+sym+'\',\'sci_'+sym+'\')">1Y</button></div></div>';
    });
    h+='</div>';
  });
  document.getElementById('idx_body').innerHTML=h;
  Object.entries(groups).forEach(function(pair){
    pair[1].forEach(function(sym){if(bk[sym])CHART(sym,90,'sc_'+sym,'sci_'+sym);});
  });
}

// ===== MACRO =====
function MCR(){
  var m=document.getElementById('main');
  m.innerHTML='<h1>Macro</h1><div class="stbar" id="sb2"></div><h2>China Macro Core</h2><div class="row" id="cnm">Loading...</div><h2>China Macro Coverage Expansion</h2><div class="row" id="cnx">Loading...</div><h2>US / Global Macro</h2><div class="row" id="usm">Loading...</div><div id="mc_extra"></div>';
  var bk=BCT.kpi||{};

function DATEOF(r){return (r.trade_date||r.observation_date||r.date||'').slice(0,10)}

function DRAW_SERIES(cv,vals,dates,unit,type,extraLines){
  var ctx=cv.getContext('2d'),W=cv.width,H=cv.height,mt=26,mb=32,ml=56,mr=14;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#151e29';ctx.fillRect(0,0,W,H);
  if(!vals.length){ctx.fillStyle='#667';ctx.font='14px system-ui';ctx.fillText('No data',ml,80);return}
  var all=vals.slice();(extraLines||[]).forEach(function(line){line.values.forEach(function(v){if(isFinite(v))all.push(v)})});
  var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all),rg=mx-mn||1,gw=W-ml-mr,gh=H-mt-mb,sx=gw/Math.max(vals.length-1,1),sy=gh/rg;
  ctx.strokeStyle='#1e2a3a';ctx.lineWidth=0.5;ctx.font='11px monospace';ctx.fillStyle='#7e8ca0';
  for(var i=0;i<=4;i++){var yv=mn+rg*(4-i)/4,yp=mt+(i/4)*gh;ctx.beginPath();ctx.moveTo(ml,Math.round(yp));ctx.lineTo(W-mr,Math.round(yp));ctx.stroke();ctx.fillText(VFMT(yv)+(unit||''),2,yp+4)}
  ctx.fillStyle='#7e8ca0';ctx.font='10px monospace';var xstep=Math.max(1,Math.floor(vals.length/8));
  for(var j=0;j<vals.length;j+=xstep){var xp=ml+j*sx;ctx.fillText((dates[j]||'').slice(5),xp-16,H-6)}
  if(type==='bar'){
    var bw=Math.max(2,Math.min(18,gw/Math.max(vals.length,1)*0.7));ctx.fillStyle='#6ea8fe';
    vals.forEach(function(v,i){var x=ml+i*sx-bw/2,y=H-mb-(v-mn)*sy;ctx.fillRect(x,y,bw,H-mb-y)});
  }else{
    ctx.strokeStyle='#6ea8fe';ctx.lineWidth=2;ctx.beginPath();
    vals.forEach(function(v,i){var x=ml+i*sx,y=H-mb-(v-mn)*sy;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  }
  var cols=['#6fcf97','#f2c76b','#ff8a7a','#b48cff'];
  (extraLines||[]).forEach(function(line,li){ctx.strokeStyle=cols[li%cols.length];ctx.lineWidth=1.3;ctx.beginPath();var started=false;line.values.forEach(function(v,i){if(!isFinite(v))return;var x=ml+i*sx,y=H-mb-(v-mn)*sy;if(started)ctx.lineTo(x,y);else{ctx.moveTo(x,y);started=true}});ctx.stroke()});
}
