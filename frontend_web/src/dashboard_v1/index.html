<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/workspace_v1/styles/workspace.css">
  <title>FR Research Workspace</title>
</head>
<body>
<div class="shell" id="workspace-shell">
  <aside class="rail" id="left-rail">
    <div class="brand">FR Workspace<small>RESEARCH OPERATING DESK</small></div>
    <div class="language-toggle" aria-label="Language">
      <button class="btn active" id="lang-zh" data-language="zh">中文</button>
      <span>|</span>
      <button class="btn" id="lang-en" data-language="en">English</button>
    </div>
    <input class="search" id="global-search" placeholder="搜索工作台">
    <nav class="nav" aria-label="Workspace navigation">
      <div class="section">研究工作台</div>
      <button id="nav-overview" class="active" data-view="overview">总览</button>
      <button id="nav-database_status" data-view="database_status">数据库</button>
      <button id="nav-modeling_workbench" data-view="modeling_workbench">建模工作台</button>
      <button id="nav-agent_simulation" data-view="agent_simulation">模拟实验</button>
      <button id="nav-connections" data-view="connections">数据连接</button>
      <div class="dashboard-subnav" id="dashboard-subnav" aria-label="Dashboard shortcuts"></div>
    </nav>
    <div class="rail-foot">本地研究工作区<br><span id="build-version">加载中</span></div>
  </aside>
  <div class="splitter" id="left-splitter" data-resize="left" role="separator" aria-label="Resize navigation panel" aria-orientation="vertical"></div>
  <main class="workspace" id="workspace-main"><div class="empty workspace-empty">Loading workspace...</div></main>
  <div class="splitter" id="right-splitter" data-resize="right" role="separator" aria-label="Resize result panel" aria-orientation="vertical"></div>
  <aside class="bridge result-bridge" id="ai-bridge">
    <div class="bridge-title"><div><div class="eyebrow">总览</div><h3 id="bridge-name">平台状态摘要</h3></div><span class="tag ok">本地</span></div>
    <p>当前显示平台状态摘要。选择左侧功能后，右侧显示该功能的结果。</p>
    <div class="targets">面板归属：<b id="bridge-module">平台状态摘要</b></div>
    <div class="bridge-status" id="bridge-status" aria-live="polite">平台状态摘要已显示。</div>
    <div id="bridge-preview" class="bridge-preview"><div class="result-empty">选择数据库字段、运行预览、检查更新或运行模拟后，这里显示对应结果。</div></div>
  </aside>
</div>
<script type="module" src="/workspace_v1/js/main.js"></script>
</body>
</html>
