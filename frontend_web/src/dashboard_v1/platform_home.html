<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FR Research Platform v2</title>
<style>:root{--bg:#0c1117;--pn:#151e29;--ln:#273241;--ink:#edf2f7;--mt:#79899c;--ac:#6ea8fe;--gr:#6fcf97;--am:#f2c76b;--rd:#ff8a7a}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:210px;background:var(--pn);border-right:1px solid var(--ln);padding:16px 12px;flex-shrink:0;overflow-y:auto}
aside h2{font-size:15px;margin-bottom:14px;color:var(--ac);font-weight:600}
aside nav a{display:block;color:var(--mt);text-decoration:none;padding:7px 10px;border-radius:5px;font-size:13px;margin:3px 0;cursor:pointer}
aside nav a:hover,aside nav a.sel{color:var(--ink);background:#1e2a3a}
main{flex:1;padding:22px 24px;overflow-y:auto;max-width:1200px}
h1{font-size:22px;margin-bottom:6px;font-weight:700}
h2{font-size:16px;margin:22px 0 10px;border-bottom:1px solid var(--ln);padding-bottom:7px;font-weight:600}
h3{font-size:14px;margin-bottom:8px;color:var(--mt)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px 16px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kpi{text-align:center;cursor:pointer}.kpi .val{font-size:24px;font-weight:700;margin:3px 0}.kpi .lab{font-size:12px;color:var(--mt)}.kpi .chg{font-size:11px;font-weight:500}.kpi .date{font-size:10px;color:#555}
.tag{padding:2px 8px;border-radius:4px;font-size:10px;display:inline-block;margin:1px}.g{background:#064e3b;color:#6ee7b7}.y{background:#78350f;color:#fcd34d}.r{background:#7f1d1d;color:#fca5a5}.gray{background:#333;color:#777}
canvas{width:100%;height:200px;background:var(--pn);border-radius:6px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px}
.c h4{font-size:12px;color:var(--mt);margin-bottom:6px}.c .info{font-size:10px;color:#555}
.ctls{display:flex;gap:6px;margin:4px 0}.ctls button{background:#252540;color:#9090b0;border:none;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer}.ctls button:hover{background:#3a3a60}
.btn{background:#2a2a40;color:#a0a0c0;border:1px solid #3a3a50;padding:5px 14px;border-radius:5px;font-size:12px;cursor:pointer}.btn:hover{background:#3a3a60}.btn.pri{background:#2563eb;color:#fff}.btn.sm{padding:3px 8px;font-size:10px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}.dg{background:var(--gr)}.dgrey{background:#555}
.stbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:12px}
.si{background:var(--pn);border:1px solid var(--ln);border-radius:5px;padding:6px 12px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--ln)}th{color:var(--mt);font-weight:500;font-size:12px}td{color:var(--ink)}
input,select,textarea{background:var(--pn);border:1px solid var(--ln);color:var(--ink);padding:5px 10px;border-radius:4px;font-size:12px;max-width:300px}
.note{font-size:11px;color:#555;margin-top:16px;border-top:1px solid var(--ln);padding-top:10px}
</style></head>
<body>
<aside><h2>FR Platform v2</h2><nav id="nav"></nav></aside>
<main id="main"><h1>Loading...</h1></main>
<script>
var NAVS=[['Home','home'],['Macro','macro'],['Rates','rates'],['FX','fx'],['Indices','indices'],['Futures','futures'],['Commodities','commodities'],['Fin Rpt','finrpt'],['Data Console','dc'],['Operations','ops'],['MS Token','token']];
var DEF_KPIS=['DXY','USD_CNY','US10Y','US2Y','FedFunds','SOFR','sh000001','sh000300','sz399006','sh000016','IF0','AU0','SC0'];
var PICKS={rates:['US10Y','US2Y','FedFunds','SOFR'],fx:['DXY','USD_CNY','EUR_USD','USD_JPY','GBP_USD'],indices:['sh000001','sh000300','sz399001','sz399006','sh000016','sh000905','sh000688','sh000852','.INX'],futures:['IF0','IC0','IH0','IM0'],commodities:['AU0','SC0','CU0','AL0','RB0','M0','EG0']};
var SD={},kpi=[],API='/api/data_console';

function initNav(){var n=document.getElementById('nav'),h='';NAVS.forEach(function(p){h+='<a id=\"n_'+p[1]+'\" onclick=\"SEL(\''+p[1]+'\')\">'+p[0]+'</a>'});n.innerHTML=h}
function SEL(sec){document.querySelectorAll('#nav a').forEach(function(a){a.classList.remove('sel')});var na=document.getElementById('n_'+sec);if(na)na.classList.add('sel');if(sec==='home')RHOME();else if(sec==='dc')RDC();else if(sec==='ops')ROPS();else if(sec==='token')RTK();else if(sec==='finrpt')RFIN();else RSEC(sec);window.scrollTo(0,0)}

async function load(){try{var r=await fetch(API+'/source_status');SD=(await r.json()).sources||{}}catch(e){};var ka=JSON.parse(localStorage.getItem('fr_kpis')||'[]');kpi=ka.length?ka:DEF_KPIS.slice();initNav();SEL('home')}

function draw(cv,vals){var ctx=cv.getContext('2d'),W=cv.width,H=cv.height,pd=24;ctx.clearRect(0,0,W,H);if(!vals.length)return;var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn||1;var sx=(W-2*pd)/(vals.length-1),sy=(H-2*pd)/rg;ctx.strokeStyle='#6ea8fe';ctx.lineWidth=1.5;ctx.beginPath();for(var i=0;i<vals.length;i++){var x=pd+i*sx,y=H-pd-(vals[i]-mn)*sy;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
async function lds(sym,lbk,cvid,infoid){var cv=document.getElementById(cvid),info=document.getElementById(infoid);if(!cv)return;try{var r=await fetch(API+'/timeseries?instrument='+encodeURIComponent(sym)+'&lookback='+lbk);var d=await r.json(),data=d.data||[];if(!data.length){if(info)info.innerHTML='<span class=\"tag r\">No data</span>';return}var vals=data.map(function(r){return r.close||r.value||0});var l=vals[vals.length-1],f=vals[0];if(info)info.innerHTML=data.length+' pts | <b>'+l+'</b> | Chg:'+(f?((l-f)/f*100).toFixed(2):'N/A')+'% | <span class=\"tag y\">trade_date_only</span>';draw(cv,vals)}catch(e){if(info)info.innerHTML='<span class=\"tag r\">Error</span>'}}

function RSB(pid){var b=document.getElementById(pid);if(!b)return;var h='';Object.entries(SD).slice(0,12).forEach(function(e){var n=e[0],v=e[1];var cls=v.record_count>0?'dg':'dgrey',tc=(v.record_count||0)>1000?((v.record_count/1000).toFixed(0)+'K'):(v.record_count||0);h+='<div class=\"si\"><span class=\"dot '+cls+'\"></span>'+n.replace(/_/g,' ')+' <b>'+tc+'</b></div>'});b.innerHTML=h;setTimeout(function(){RSB(pid)},30000)}

// ===== HOME =====
function RHOME(){var m=document.getElementById('main');m.innerHTML='<h1>FR Research Platform v2</h1><div class=\"stbar\" id=\"stb\"></div><h2>Key Indicators</h2><div class=\"row\" id=\"kpiRow\"></div><h2>Quick Charts</h2><div class=\"charts\" id=\"qCharts\"></div>';RSB('stb');RKP();RQC()}
async function RKP(){var row=document.getElementById('kpiRow');if(!row)return;row.innerHTML='';for(var i=0;i<kpi.length;i++){var sym=kpi[i];try{var r=await fetch(API+'/timeseries?instrument='+encodeURIComponent(sym)+'&lookback=3');var d=await r.json(),data=d.data||[];if(!data.length){row.innerHTML+='<div class=\"card kpi\"><div class=\"lab\">'+sym+'</div><div class=\"val\">--</div><div class=\"date\"><span class=\"tag r\">no data</span></div></div>';continue}var l=data[data.length-1],lv=l.close||l.value||0;var prv=data.length>1?(data[data.length-2].close||data[data.length-2].value||0):lv;var chg=prv?((lv-prv)/prv*100).toFixed(2):'0',cl=parseFloat(chg)>=0?'var(--gr)':'var(--rd)';row.innerHTML+='<div class=\"card kpi\" onclick=\"SEL(\''+fs(sym)+'\')\"><div class=\"lab\">'+sym+'</div><div class=\"val\">'+(lv||'?')+'</div><div class=\"chg\" style=\"color:'+cl+'\">'+chg+'%</div><div class=\"date\">'+(l.trade_date||l.observation_date||'').slice(0,10)+'</div></div>'}catch(e){row.innerHTML+='<div class=\"card kpi\"><div class=\"lab\">'+sym+'</div><div class=\"val\">--</div><div class=\"date\"><span class=\"tag r\">API Error</span></div></div>'}}}
function fs(sym){for(var k in PICKS)if(PICKS[k].indexOf(sym)>=0)return k;return'home'}
async function RQC(){var ct=document.getElementById('qCharts');if(!ct)return;ct.innerHTML='';for(var i=0;i<Math.min(4,kpi.length);i++){var sym=kpi[i],cid='qc_'+i,iid='qci_'+i;var box=document.createElement('div');box.className='c';box.innerHTML='<h4>'+sym+'</h4><canvas id=\"'+cid+'\" width=\"340\" height=\"160\"></canvas><div class=\"info\" id=\"'+iid+'\"></div>';ct.appendChild(box);lds(sym,30,cid,iid)}}

// ===== SECTOR =====
function RSEC(sec){var picks=PICKS[sec]||[],m=document.getElementById('main');m.innerHTML='<h1>'+sec.toUpperCase()+'</h1><div class=\"stbar\" id=\"stb2\"></div><div class=\"row\" id=\"sKPIs\"></div><h2>Charts</h2><div class=\"charts\" id=\"sCharts\"></div>';RSB('stb2');var sk=document.getElementById('sKPIs'),sct=document.getElementById('sCharts');picks.forEach(function(sym,i){sk.innerHTML+='<div class=\"card kpi\" id=\"sk_'+sym+'\"><div class=\"lab\">'+sym+'</div><div class=\"val\" style=\"font-size:16px\">...</div></div>';var box=document.createElement('div');box.className='c';box.innerHTML='<h4>'+sym+'</h4><canvas id=\"sc_'+sym+'\" width=\"340\" height=\"160\"></canvas><div class=\"info\" id=\"sci_'+sym+'\"></div><div class=\"ctls\"><button class=\"btn sm\" onclick=\"lds(\''+sym+'\',7,\'sc_'+sym+'\',\'sci_'+sym+'\')\">7D</button><button class=\"btn sm\" onclick=\"lds(\''+sym+'\',30,\'sc_'+sym+'\',\'sci_'+sym+'\')\">1M</button><button class=\"btn sm\" onclick=\"lds(\''+sym+'\',90,\'sc_'+sym+'\',\'sci_'+sym+'\')\">3M</button><button class=\"btn sm\" onclick=\"lds(\''+sym+'\',365,\'sc_'+sym+'\',\'sci_'+sym+'\')\">1Y</button></div>';sct.appendChild(box);lds(sym,90,'sc_'+sym,'sci_'+sym);fetch(API+'/timeseries?instrument='+encodeURIComponent(sym)+'&lookback=2').then(function(r){return r.json()}).then(function(d){var data=d.data||[];if(!data.length)return;var l=data[data.length-1],lv=l.close||l.value||0;document.getElementById('sk_'+sym).innerHTML='<div class=\"lab\">'+sym+'</div><div class=\"val\" style=\"font-size:16px\">'+(lv||'?')+'</div><div class=\"date\">'+(l.trade_date||l.observation_date||'').slice(0,10)+'</div>'});});}

// ===== DATA CONSOLE =====
function RDC(){var m=document.getElementById('main');m.innerHTML='<h1>Data Console</h1><input id=\"dcS\" oninput=\"DCF()\" placeholder=\"Filter...\" style=\"margin-bottom:8px\"><table id=\"dcT\"><tr><th>Source</th><th>Records</th><th>Latest</th></tr></table>';window.dcR=[];Object.entries(SD).forEach(function(e){window.dcR.push({n:e[0].replace(/_/g,' '),r:e[1].record_count||0,d:e[1].latest_date||''})});DCF()}
function DCF(){var kw=(document.getElementById('dcS').value||'').toLowerCase();var rows=(window.dcR||[]).filter(function(r){return!kw||r.n.toLowerCase().indexOf(kw)>=0});var h='<tr><th>Source</th><th>Records</th><th>Latest</th></tr>';rows.forEach(function(r){h+='<tr><td>'+r.n+'</td><td>'+r.r.toLocaleString()+'</td><td>'+r.d+'</td></tr>'});document.getElementById('dcT').innerHTML=h}

// ===== OPERATIONS =====
async function ROPS(){var m=document.getElementById('main');m.innerHTML='<h1>Operations Console</h1><p>CLI <code>--dry-run</code> is preview-only. Buttons below explicitly execute updates.</p><div id=\"opsT\">Loading...</div>';try{var r=await fetch(API+'/updateable_products');var d=await r.json(),prods=d.products||{};var h='<table><tr><th>Product</th><th>Enabled</th><th>Status</th><th>Last Run</th><th colspan=2>Actions</th></tr>';Object.entries(prods).forEach(function(e){var pid=e[0],p=e[1];var lr=p.last_run||{},ls=lr.status||'never',tc=ls==='success'?'g':ls==='failed'?'r':ls==='running'?'y':'gray';h+='<tr><td>'+p.product_name+'</td><td>'+(p.enabled?'<span class=\"tag g\">yes</span>':'<span class=\"tag gray\">no</span>')+'</td><td><span class=\"tag '+tc+'\">'+ls+'</span></td><td>'+(lr.started_at||'N/A').slice(0,16)+'</td><td id=\"ob_'+pid+'\">'+(p.enabled?'<button class=\"btn sm\" onclick=\"OTR(\''+pid+'\')\">Execute update</button>':'<span class=\"tag gray\">disabled</span>')+'</td><td>'+(p.disabled_reason||'')+'</td></tr>'});h+='</table>';document.getElementById('opsT').innerHTML=h}catch(e){document.getElementById('opsT').innerHTML='<p style=\"color:var(--rd)\">API error. Check backend status.</p>'}}
async function OTR(pid){var b=document.getElementById('ob_'+pid);if(b)b.innerHTML='<span class=\"tag y\">running..</span>';try{await fetch(API+'/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:pid,execute:true})});setTimeout(ROPS,2000)}catch(e){if(b)b.innerHTML='<span class=\"tag r\">failed</span>'}}

// ===== TOKEN =====
function RTK(){var m=document.getElementById('main');m.innerHTML='<h1>MS Token</h1><div class=\"card\" style=\"max-width:520px\"><input type=\"password\" id=\"tkI\" placeholder=\"Paste JWT token\" style=\"width:100%;margin:6px 0\"><input id=\"tkH\" placeholder=\"Account hint\" style=\"width:100%;margin-bottom:8px\"><button class=\"btn pri\" onclick=\"TKSAVE()\">Save</button> <button class=\"btn\" onclick=\"TKLOAD()\">Refresh</button><div id=\"tkS\" style=\"margin-top:10px;font-size:12px\"></div><div style=\"font-size:10px;color:#555;margin-top:8px\">Token in config/local_secrets.json. Not committed. Masked display. 24h validity.</div></div>';TKLOAD()}
async function TKSAVE(){var tk=document.getElementById('tkI').value.trim(),hint=document.getElementById('tkH').value.trim();if(!tk){alert('Paste token first');return}var b={md_auth_token:tk};if(hint)b.account_hint=hint;try{var r=await fetch('/api/dashboard/morningstar/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});var d=await r.json();document.getElementById('tkI').value='';document.getElementById('tkS').innerHTML=d.status==='ok'?'<span class=\"tag g\">Saved</span> '+d.masked_token:'<span class=\"tag r\">Error</span> '+(d.reason||'');if(d.status==='ok')setTimeout(TKLOAD,500)}catch(e){document.getElementById('tkS').innerHTML='<span class=\"tag r\">Error</span>'}}
async function TKLOAD(){try{var r=await fetch('/api/dashboard/morningstar/token_status');var d=await r.json();var s=d.status||'missing',c=s.indexOf('valid')>=0?'g':'gray';document.getElementById('tkS').innerHTML='<span class=\"tag '+c+'\">'+s+'</span> '+d.masked_token+' | '+d.remaining_hours+'h | '+d.token_saved_at}catch(e){document.getElementById('tkS').innerHTML='<span class=\"tag r\">Error</span>'}}

// ===== FINANCIAL REPORTS =====
function RFIN(){var m=document.getElementById('main');m.innerHTML='<h1>Financial Report Workspace</h1><div class=\"stbar\"><div class=\"si\"><span class=\"dot dg\"></span>Fin Statements: production_candidate</div><div class=\"si\"><span class=\"dot dg\"></span>Disclosures: production_candidate</div><div class=\"si\"><span class=\"dot dg\"></span>PDF Gov: <b>controlled_batch_partial</b> — annual reports only, NOT full A-share universe</div></div><h2>A-Share PDF Audit</h2><div class=\"card\"><p style=\"font-size:13px;margin-bottom:6px\"><b>A-Share PDF Coverage:</b> <span class=\"tag y\">NOT complete</span> — currently controlled batch of annual reports only. Full universe of quarterly/semi-annual reports not yet downloaded.</p><table><tr><th>Metric</th><th>Value</th></tr><tr><td>PDF Governance</td><td>Controlled batch — partial annual reports</td></tr><tr><td>Structured Financials</td><td>production_candidate — Stage 1 data product</td></tr><tr><td>Disclosure Metadata</td><td>production_candidate</td></tr><tr><td>Parse Lab Integration</td><td><span class=\"tag gray\">pending</span></td></tr><tr><td>Full A-Share Coverage</td><td><span class=\"tag y\">Not complete</span> — annuals only</td></tr></table></div><h2>Company Search</h2><input id=\"finT\" placeholder=\"e.g. 600519\" style=\"width:120px\"><button class=\"btn\" onclick=\"FSRCH()\">Search</button><div id=\"finR\" style=\"margin:10px 0\"></div><h2>Analysis Reports</h2><textarea id=\"finTx\" placeholder=\"Paste report from Web GPT...\" style=\"width:100%;height:80px\"></textarea><br><input id=\"finLb\" placeholder=\"Label\" style=\"width:200px;margin:6px 0\"><button class=\"btn pri\" onclick=\"FSAVE()\">Save</button><div id=\"finS\" style=\"margin:10px 0\"></div>';FL()}
async function FSRCH(){var t=document.getElementById('finT').value.trim()||'600519';document.getElementById('finR').innerHTML='<div class=\"card\">Loading structured financials...</div>';try{var r=await fetch('/api/company/financial_summary?symbol='+encodeURIComponent(t));var d=await r.json(),h='<div class=\"card\"><b>'+(d.company_name||t)+'</b> | Stage 1 structured financials<br><table style=\"margin-top:6px\"><tr><th>Item</th><th>Latest</th><th>Period</th></tr>';(d.metrics||[]).slice(0,6).forEach(function(m){h+='<tr><td>'+m.label+'</td><td>'+m.value+'</td><td>'+(m.period_label||m.report_period||'')+'</td></tr>'});h+='</table><p style=\"font-size:10px;color:var(--mt);margin-top:4px\">Core financial values come from structured financial APIs. PDF parse_lab is for text, explanation and evidence anchors.</p></div>';document.getElementById('finR').innerHTML=h}catch(e){document.getElementById('finR').innerHTML='<div class=\"card\">Financial API error</div>'}}
function FSAVE(){var t=document.getElementById('finTx').value.trim(),l=document.getElementById('finLb').value.trim()||'Untitled';if(!t)return;var rpts=JSON.parse(localStorage.getItem('fr_rpts')||'[]');rpts.push({l:l,t:t,d:new Date().toISOString().slice(0,10),tk:document.getElementById('finT').value.trim()||'N/A'});localStorage.setItem('fr_rpts',JSON.stringify(rpts));document.getElementById('finTx').value='';FL()}
function FL(){var rpts=JSON.parse(localStorage.getItem('fr_rpts')||'[]'),d=document.getElementById('finS');if(!d||!rpts.length)return;var h='<table><tr><th>Label</th><th>Company</th><th>Date</th></tr>';rpts.reverse().forEach(function(r){h+='<tr><td>'+r.l+'</td><td>'+r.tk+'</td><td>'+r.d+'</td></tr>'});h+='</table>';d.innerHTML=h}

load();
document.getElementById('main').insertAdjacentHTML('afterend','<div class=\"note\">FR Platform v2 | Stage1+2 | All data from live APIs | as-of=trade_date_only | No AI/OpenAI | Trusted disabled | Non-China equity excluded</div>');
</script>
</body></html>
